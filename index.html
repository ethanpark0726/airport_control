<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Airport Control</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game-shell">
    <canvas id="radar" aria-label="Airport control radar game"></canvas>
    <section class="hud" aria-label="Flight status">
      <div>
        <span>Stage</span>
        <strong id="stage">1</strong>
      </div>
      <div>
        <span>Score</span>
        <strong id="score">0</strong>
      </div>
      <div>
        <span>Landed</span>
        <strong id="landed">0 / 8</strong>
      </div>
      <div>
        <span>Lives</span>
        <strong id="lives">3</strong>
      </div>
      <button id="soundToggle" type="button" title="Toggle Sound">🔊 Sound</button>
      <button id="restart" type="button" title="Restart">Restart</button>
    </section>
    <section class="briefing" aria-label="Controls">
      <strong>Airport Control</strong>
      <span>Click an aircraft, then click the radar to assign its vector.</span>
    </section>
  </main>
  <script src="landingSoundData.js"></script>
  <script src="sound.js"></script>
  <script src="game.js"></script>
</body>
</html>
